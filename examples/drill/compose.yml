# A restore drill on your laptop with nothing but Docker.
#
#   docker compose run --rm drill            # restore the latest backup and check row counts
#   docker compose run --rm drill verify     # quick check, no database needed
#   docker compose run --rm drill decrypt latest --out /out/backup.dump
#   docker compose down -v                   # throw the scratch database away
#
# Settings come from .env (copy .env.example). Match both images to your Postgres major
# version: postgres:17 + pgbackup-r2:pg17, and so on.

name: pgbackup-r2-drill

services:
  scratch:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: scratch-only-throwaway
      POSTGRES_DB: drill
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drill"]
      interval: 2s
      timeout: 5s
      retries: 30
    # No published ports: only the drill container can reach it.

  drill:
    image: ${PGBACKUP_IMAGE:-ghcr.io/iotabyt/pgbackup-r2:pg16}
    env_file: .env
    environment:
      DRILL_DATABASE_URL: postgresql://postgres:scratch-only-throwaway@scratch:5432/drill
    depends_on:
      scratch:
        condition: service_healthy
    volumes:
      - ./out:/out
    command: ["drill"]
