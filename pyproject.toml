[project]
name = "pgbackup-r2"
dynamic = ["version"]
description = "Encrypted Postgres backups to Cloudflare R2 (or any S3), with restore drills that prove they work."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Frank Owusu Boakye" }]
keywords = ["postgres", "postgresql", "backup", "r2", "s3", "age", "restore", "drill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = ["boto3>=1.36", "rich>=13.7", "rich-argparse>=1.5"]

[project.urls]
Homepage = "https://github.com/iotabyt/pgbackup-r2"
Issues = "https://github.com/iotabyt/pgbackup-r2/issues"
Changelog = "https://github.com/iotabyt/pgbackup-r2/blob/main/CHANGELOG.md"

[project.scripts]
pgbackup-r2 = "pgbackup_r2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pgbackup_r2/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pgbackup_r2"]

[tool.hatch.build.targets.sdist]
# Leading slashes anchor these at the project root: unanchored, "README.md" would also match
# every README under docs/node_modules.
include = [
    "/src/",
    "/tests/",
    "/examples/",
    "/scripts/",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/Dockerfile",
]
exclude = ["/docs/"]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[server]>=5",
    "ruff>=0.6",
    "shellcheck-py>=0.11.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
